<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI — Your AI Workspace</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--panel:#fff;--ink:#202438;--muted:#7b8195;--line:#e7e9f1;--accent:#7057e8;--soft:#f0edff}
[data-theme=dark]{color-scheme:dark;--bg:#11131b;--panel:#1b1e29;--ink:#f0f1fa;--muted:#a4a9bc;--line:#303445;--accent:#a594ff;--soft:#29243e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif;height:100vh}
.app{height:100vh;display:flex}.side{width:260px;background:var(--panel);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#8870fa,#4a35bd);color:white;display:grid;place-items:center;font-weight:900}
.new{background:var(--soft);color:var(--accent);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left;font-weight:700;cursor:pointer}.small{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px;margin:12px 2px 0}.history{overflow:auto;display:grid;gap:5px}.history button{border:0;background:transparent;color:var(--muted);padding:9px;text-align:left;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history button:hover{background:var(--bg);color:var(--ink)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--panel)}.top strong{font-size:14px}.top button,.top select{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:8px 11px;cursor:pointer}
.stream{flex:1;overflow:auto;padding:30px 18px}.welcome{max-width:760px;margin:8vh auto 0;text-align:center}.orb{width:60px;height:60px;margin:auto auto 20px;border-radius:20px;background:linear-gradient(135deg,#a99bff,#5e42d4);display:grid;place-items:center;color:white;font-size:27px;box-shadow:0 12px 35px #7057e833}.welcome h1{font-size:34px;letter-spacing:-1.3px;margin:0 0 9px}.welcome p{color:var(--muted);margin:0 0 28px}.suggest{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.suggest button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;cursor:pointer}.suggest button:hover{border-color:var(--accent)}
.messages{max-width:820px;margin:auto;display:grid;gap:22px}.msg{display:flex;gap:12px;align-items:flex-start}.avatar{width:30px;height:30px;flex:none;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800}.msg.user .avatar{background:#e7e9f1;color:#41475b}.bubble{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding:4px 0}.role{font-size:12px;font-weight:800;margin-bottom:5px}.msg.assistant .bubble{max-width:100%}.msg.user .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.composer-wrap{padding:12px 18px 16px}.composer{max-width:820px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 8px 30px #1f24400d}.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;min-height:54px;max-height:160px}.tools{display:flex;align-items:center;justify-content:space-between;gap:10px}.tools button{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:8px;cursor:pointer}.tools button:hover{background:var(--soft);color:var(--accent)}.send{background:var(--accent)!important;color:#fff!important;padding:9px 15px!important;font-weight:700}.send:disabled{opacity:.4;cursor:not-allowed}.hint{text-align:center;color:var(--muted);font-size:11px;padding-top:9px}.filelabel{font-size:12px;color:var(--muted);padding:4px 2px}
@media(max-width:700px){.side{position:fixed;z-index:4;left:-280px;top:0;bottom:0;transition:left .2s;box-shadow:0 0 40px #0002}.side.open{left:0}.top{padding:0 14px}.stream{padding:20px 13px}.welcome{margin-top:5vh}.welcome h1{font-size:28px}.suggest{grid-template-columns:1fr}.composer-wrap{padding:9px}.top .menubtn{display:inline-block!important}}
</style></head>
<body><div class="app">
<aside class="side" id="side"><div class="brand"><span class="mark">N</span> NOVA AI</div><button class="new" id="new">＋ &nbsp; New chat</button><div class="small">RECENT CHATS</div><div class="history" id="history"></div><div class="sidefoot">Powered by Google Gemini<br>Keep your API key private.</div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="menubtn" id="menu" style="display:none">☰</button><strong>Nova AI Workspace</strong></div><div style="display:flex;gap:8px"><select id="model" aria-label="Model"><option value="gemini-3.8-flash">Gemini 3.8 Flash</option><option value="gemini-3.7-flash">Gemini 3.7 Flash</option></select><button id="theme" title="Toggle theme">◐</button></div></header>
<section class="stream" id="stream"><div class="welcome" id="welcome"><div class="orb">✦</div><h1>What can I help with?</h1><p>Ask a question, explore an idea, or upload a file to get started.</p><div class="suggest"><button data-prompt="Explain a difficult topic in simple steps.">✧ &nbsp; Explain something clearly</button><button data-prompt="Help me plan and organize my week.">▦ &nbsp; Plan my week</button><button data-prompt="Give me creative ideas for a new project.">✳ &nbsp; Brainstorm ideas</button><button data-prompt="Review this text and suggest improvements.">⌁ &nbsp; Improve my writing</button></div></div><div class="messages" id="messages"></div></section>
<div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="Message Nova AI…" rows="2"></textarea><div class="filelabel" id="filelabel"></div><div class="tools"><div><button id="attach" title="Attach image or PDF">＋ Attach</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" multiple hidden><button id="voice" title="Voice input">♩ Voice</button></div><button class="send" id="send" disabled>Send ↑</button></div></div><div class="hint">Nova AI can make mistakes. Check important information.</div></div></main></div>
<script>
const $=s=>document.querySelector(s);let chats=[],active=null,files=[];
function fresh(){active={title:"New chat",items:[]};chats.unshift(active);render();$('#prompt').focus()}
function render(){const has=active&&active.items.length;$('#welcome').style.display=has?'none':'block';$('#messages').innerHTML='';if(active)active.items.forEach(m=>addMessage(m.role,m.text));$('#history').innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.textContent=c.title;b.onclick=()=>{active=c;render()};$('#history').append(b)});$('#messages').scrollIntoView({block:'end'})}
function addMessage(role,text){const el=document.createElement('div');el.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='assistant'?'✦':'U';const b=document.createElement('div');b.className='bubble';const r=document.createElement('div');r.className='role';r.textContent=role==='assistant'?'NOVA AI':'YOU';const t=document.createElement('div');t.textContent=text;b.append(r,t);el.append(av,b);$('#messages').append(el)}
function payloadFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,mimeType:file.type||'application/octet-stream',data:String(r.result).split(',')[1]||''});r.onerror=reject;r.readAsDataURL(file)})}
async function send(){const q=$('#prompt').value.trim();if(!q&&!files.length)return;if(!active)fresh();const uploaded=files;files=[];$('#filelabel').textContent='';active.items.push({role:'user',text:q+(uploaded.length?'\n[Attached: '+uploaded.map(f=>f.name).join(', ')+']':'')});if(active.title==='New chat')active.title=q.slice(0,34)||'File chat';$('#prompt').value='';$('#send').disabled=true;render();const loading={role:'assistant',text:'Thinking…'};active.items.push(loading);render();try{const hist=active.items.slice(0,-1).slice(-16).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]}));if(uploaded.length){const last=hist[hist.length-1];for(const f of uploaded){const p=await payloadFile(f);last.parts.push({inlineData:{mimeType:p.mimeType,data:p.data}})}}const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,model:$('#model').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');loading.text=data.text||'(No text returned)'}catch(e){loading.text='Sorry, I could not get a response. '+e.message+'\n\nCheck that GEMINI_API_KEY is configured in your hosting dashboard.'}render();$('#prompt').focus()}
$('#new').onclick=fresh;$('#send').onclick=send;$('#prompt').addEventListener('input',()=>{$('#send').disabled=!$('#prompt').value.trim()&&!files.length;$('#prompt').style.height='auto';$('#prompt').style.height=Math.min($('#prompt').scrollHeight,160)+'px'});$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#prompt').value=b.dataset.prompt;$('#send').disabled=false;$('#prompt').focus()});
$('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#attach').onclick=()=>$('#file').click();$('#file').onchange=async e=>{for(const f of e.target.files){if(f.size>4*1024*1024){alert(f.name+' is larger than 4 MB');continue}files.push(f)}$('#filelabel').textContent=files.length+' file(s) attached';$('#send').disabled=false;e.target.value=''};
$('#voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input is not supported by this browser.');return}const r=new SR();r.lang='en-IN';r.onresult=e=>{$('#prompt').value+=($('#prompt').value?' ':'')+e.results[0][0].transcript;$('#send').disabled=false};r.start()};
fresh();
</script></body></html>
